<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Learn Portugues</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/course/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563EB;
      --primary-foreground: #FFFFFF;
      --background: #F2F3F0;
      --foreground: #111111;
      --muted-foreground: #666666;
      --font-primary: 'JetBrains Mono', monospace;
      --font-secondary: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-pill: 999px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111111;
        --foreground: #FFFFFF;
        --muted-foreground: #B8B9B6;
      }
    }
    body { font-family: var(--font-secondary); color: var(--foreground); background: var(--background); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 40px 24px; max-width: 520px; }
    .code { font-family: var(--font-primary); font-size: 96px; font-weight: 700; color: var(--primary); line-height: 1; }
    h1 { font-family: var(--font-primary); font-size: 24px; font-weight: 700; margin-top: 16px; }
    p { font-size: 16px; color: var(--muted-foreground); margin-top: 12px; line-height: 1.6; }
    .links { margin-top: 32px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-primary); font-size: 14px; font-weight: 500; padding: 12px 24px; border-radius: var(--radius-pill); text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .btn-ghost { color: var(--foreground); border: 1px solid var(--muted-foreground); }
    .btn-ghost:hover { border-color: var(--foreground); }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы не существует. Возможно, она была перемещена или удалена.</p>
    <div class="links">
      <a href="/" class="btn-primary">На главную</a>
      <a href="/course/" class="btn-ghost">Открыть курс</a>
    </div>
  </div>
</body>
</html>
