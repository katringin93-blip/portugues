<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Portugues - Curso de Portugues Europeu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    // Apply theme early to avoid flash
    (function(){try{var t=localStorage.getItem('pt_course_theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t)}}catch(e){}})();
  </script>

<body>
  <div id="app"></div>

  <script type="module">
    import { createApp } from './js/app.js';
    createApp();
  </script>
  <script nomodule>

      '<div style="text-align:center;padding:3rem 1rem;font-family:sans-serif;">' +
      '<h2>Browser not supported / Браузер не поддерживается / Браузер не підтримується</h2>' +
